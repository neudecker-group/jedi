name: Run linter

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: latest

      - name: run linter
        run: uvx ruff check --output-format=github .
