name: CI

on:
  push:
  pull_request:
   
permissions:
  contents: read # for checkout

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    uses: ./.github/workflows/check-test.yaml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python-version }}
