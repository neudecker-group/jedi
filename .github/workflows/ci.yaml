name: CI

on:
  push:
  pull_request:
   
permissions:
  contents: read # for checkout

jobs:
  format:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write # to push the formatting changes
    uses: ./.github/workflows/check-format.yaml

  lint:
    needs: [format]
    if: |
      github.event_name == 'pull_request'
      && ( needs.format.result == 'skipped' || needs.format.result == 'success' )
    uses: ./.github/workflows/check-lint.yaml

  run-tests:
    needs: [format]
    if: |
      github.event_name == 'pull_request'
      && ( needs.format.result == 'skipped' || needs.format.result == 'success' )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    uses: ./.github/workflows/check-test.yaml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python-version }}

  build-wheel:
    needs: [format]
    if: |
      github.event_name == 'pull_request'
      && ( needs.format.result == 'skipped' || needs.format.result == 'success' )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    uses: ./.github/workflows/check-build.yaml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python-version }}
