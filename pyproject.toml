[project]
name = "strainjedi"
description = "Judgement of Energy DIstribution - quantum chemical strain analysis"
version = "1.0.0"
readme = "README.rst"
license = "MIT"
license-files = [
    "LICENSE",
]
requires-python = ">=3.10"

dependencies = [
    "ase>=3.28.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "typing-extensions>=4.15.0",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
]

[project.scripts]
strainjedi = "strainjedi.main:main"

[project.urls]
Homepage = "https://github.com/neudecker-group/jedi"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
docs = [
    "furo==2025.12.19",
    "sphinx==8.1.3",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.5.0",
    "sphinxcontrib-lightbox2>=0.6.0",
    "sphinxcontrib-video==0.4.2",
]
lint = [
    "ruff",
]
test = [
    "pytest",
    "pyyaml",
]
types = [
    "ty",
]

[tool.setuptools]
packages = [
    "strainjedi",
    "strainjedi.io",
]

[tool.pytest]
addopts = ["-v", "--tb=long"]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E741", # do not lint ambigious variables names such as l, O, I
]
