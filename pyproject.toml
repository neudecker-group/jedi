[project]
name = "strainjedi"
description = "Judgement of Energy DIstribution - quantum chemical strain analysis"
version = "1.0.0"
readme = "README.rst"
license = "MIT"
license-files = [
    "LICENSE",
]
requires-python = ">=3.12"

dependencies = [
    "mpi4py>=2.0",
    "numpy",
    "ase",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
strainjedi = "strainjedi.main:main"

[project.urls]
Homepage = "https://github.com/neudecker-group/jedi"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
docs = [
    "sphinx==4.2.0",
    "sphinx-rtd-theme==1.3.0rc1",
    "numpy",
    "ase",
    "furo==2021.11.16",
    "sphinxcontrib-video==0.2.0",
]
lint = [
    "ruff",
]
test = [
    "pytest",
]
types = [
    "ty",
]

[tool.setuptools]
packages = [
    "strainjedi",
    "strainjedi.io",
]
